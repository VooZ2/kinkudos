services:
  app:
    networks:
      - web

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      KINKUDOS_HOSTNAME: "${KINKUDOS_HOSTNAME}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - web
      - caddy-egress
    labels:
      com.centurylinklabs.watchtower.enable: "false"

networks:
  web:
    internal: true
  caddy-egress:

volumes:
  caddy-data:
  caddy-config:
