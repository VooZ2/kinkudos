server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Traefik terminates HTTPS. Keep directory redirects relative so Nginx
    # never sends the browser back to an internal http:// URL.
    absolute_redirect off;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
