server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Traefik terminates HTTPS. Keep directory redirects relative so Nginx
    # never sends the browser back to an internal http:// URL.
    absolute_redirect off;

    # Stable redirects for the 2026 installation-information restructure.
    location = /start/quick-install/ { return 301 /installation/guided-installer/; }
    location = /start/quick-install.lt/ { return 301 /installation/guided-installer.lt/; }
    location = /start/quick-install.de/ { return 301 /installation/guided-installer.de/; }
    location = /start/quick-install.fr/ { return 301 /installation/guided-installer.fr/; }
    location = /server/before-installing/ { return 301 /installation/; }
    location = /server/before-installing.lt/ { return 301 /installation/index.lt/; }
    location = /server/updates-and-recovery/ { return 301 /installation/updating/; }
    location = /server/updates-and-recovery.lt/ { return 301 /installation/updating.lt/; }
    location = /deployment-and-maintenance/ { return 301 /administration/; }
    location = /deployment-and-maintenance.lt/ { return 301 /administration/index.lt/; }
    location = /security/backups/ { return 301 /backups/; }
    location = /security/backups.lt/ { return 301 /backups.lt/; }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
