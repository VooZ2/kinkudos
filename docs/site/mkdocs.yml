site_name: KinKudos
site_description: Help for KinKudos families
site_url: https://docs.kinkudos.app

# Keep the public documentation self-contained: the server copies this folder
# and builds it without needing the application source tree.
docs_dir: .
site_dir: ../site

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/kinkudos-icon.png
  favicon: assets/favicon-32.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Use dark appearance
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Use light appearance
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/kinkudos.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true

