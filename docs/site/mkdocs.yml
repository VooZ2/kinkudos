site_name: KinKudos
site_description: Help for KinKudos families
site_url: https://docs.kinkudos.app
strict: true

# Keep the public documentation self-contained: the server copies this folder
# and builds it without needing the application source tree.
docs_dir: .
site_dir: ../site

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/kinkudos-icon.png
  favicon: assets/favicon-32.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Use dark appearance
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Use light appearance
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/kinkudos.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Start:
      - What is KinKudos: start/what-is-kinkudos.md
      - Is KinKudos right for your family?: start/is-kinkudos-right.md
      - What self-hosting means: start/what-self-hosting-means.md
      - Quick install: start/quick-install.md
      - Your first 15 minutes: start/first-15-minutes.md
      - Pair a child device: start/pair-a-child-device.md
  - Parents:
      - Parent dashboard: parents/dashboard-and-child-cards.md
      - Create and manage tasks: parents/create-and-manage-tasks.md
      - Review completed tasks: parents/review-completed-tasks.md
      - Assign tasks for today: parents/assign-tasks-today.md
      - Points, penalties, and corrections: parents/points-and-corrections.md
      - Create and manage rewards: parents/create-and-manage-rewards.md
      - Savings goals and suggestions: parents/savings-goals.md
      - Lottery tickets: parents/lottery-tickets.md
      - Child space: parents/child-space.md
      - Parent settings: parents/settings.md
  - Security:
      - Accounts and devices: security/accounts-and-devices.md
      - PINs and sign-in protection: security/pin-and-sign-in.md
      - Notifications and installing KinKudos: security/notifications-and-pwa.md
      - Network access: security/network-access.md
      - Backups: security/backups.md
  - Server:
      - Overview: deployment-and-maintenance.md
      - Before installing: server/before-installing.md
      - Updates, backups, and recovery: server/updates-and-recovery.md
  - Family admin: family-administration.md
  - Help: quick-help.md
  - Reference:
      - Roles, data, and limits: reference/roles-and-data.md
      - Release and support policy: reference/release-and-support-policy.md
