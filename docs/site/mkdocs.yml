      - What is KinKudos: start/what-is-kinkudos.md
      - Is KinKudos right for your family?: start/is-kinkudos-right.md
      - What self-hosting means: start/what-self-hosting-means.md
      - Guided server installer: installation/guided-installer.md
      - Your first 15 minutes: start/first-15-minutes.md
      - Pair a child device: start/pair-a-child-device.md
  - Parents:
      - Parent dashboard: parents/dashboard-and-child-cards.md
      - Tasks and approvals: parents/tasks-and-approvals.md
      - Create and manage tasks: parents/create-and-manage-tasks.md
      - Review completed tasks: parents/review-completed-tasks.md
      - Assign tasks for today: parents/assign-tasks-today.md
      - Points, penalties, and corrections: parents/points-and-corrections.md
      - Rewards, goals, and scratch tickets: parents/rewards-goals-and-lottery.md
      - Create and manage rewards: parents/create-and-manage-rewards.md
      - Savings goals and suggestions: parents/savings-goals.md
      - Scratch tickets: parents/lottery-tickets.md
      - Child space: parents/child-space.md
      - Activity history and filters: parents/history.md
      - Parent settings: parents/settings.md
  - Security:
      - Accounts and devices: security/accounts-and-devices.md
      - PINs and sign-in protection: security/pin-and-sign-in.md
      - Notifications and installing KinKudos: security/notifications-and-pwa.md
      - Network access: security/network-access.md
      - Backups: backups.md
  - Installation:
      - Choose a method: installation/index.md
      - Hostinger VPS: installation/hostinger.md
      - Guided server installer: installation/guided-installer.md
      - Docker Compose: installation/docker-compose.md
      - First-time web setup: installation/first-time-setup.md
      - Updating KinKudos: installation/updating.md
      - Backups and restore: backups.md
