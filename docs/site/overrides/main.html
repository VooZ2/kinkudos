{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  <script defer src="https://stats.enduristas.lt/script.js" data-website-id="b47fc9f2-ce4f-4aee-8254-5935471ffb21"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      function mountLanguageSwitchers() {
      var path = window.location.pathname;
      var isLithuanian = /\.lt\/$/.test(path) || path === "/index.lt/";
      var englishPath = isLithuanian
        ? path.replace(/index\.lt\/$/, "").replace(/\.lt\/$/, "/") || "/"
        : path;
      var lithuanianPath = isLithuanian
        ? path
        : path === "/" ? "/index.lt/" : path.replace(/\/$/, ".lt/");

      function switcher(className) {
        var nav = document.createElement("div");
        nav.className = "kinkudos-language-switcher " + className;
        nav.dataset.path = path;
        nav.setAttribute(
          "aria-label",
          isLithuanian ? "Dokumentacijos kalba" : "Documentation language"
        );
        nav.innerHTML =
          '<label><span>' + (isLithuanian ? "Kalba" : "Language") + '</span>' +
          '<select aria-label="' + (isLithuanian ? "Dokumentacijos kalba" : "Documentation language") + '">' +
          '<option value="' + englishPath + '"' + (!isLithuanian ? " selected" : "") + '>English</option>' +
          '<option value="' + lithuanianPath + '"' + (isLithuanian ? " selected" : "") + '>Lietuvių</option>' +
          '</select></label>';
        nav.querySelector("select").addEventListener("change", function (event) {
          window.location.assign(event.target.value);
        });
        return nav;
      }

      function lithuanianPath(urlValue) {
        if (urlValue.charAt(0) === "#") {
          return urlValue;
        }
        var url = new URL(urlValue, window.location.origin);
        if (url.origin !== window.location.origin) {
          return urlValue;
        }
        if (url.pathname === "/") {
          return "/index.lt/" + url.search + url.hash;
        }
        if (!/\.lt\/$/.test(url.pathname)) {
          url.pathname = url.pathname.replace(/\/$/, ".lt/");
        }
        return url.pathname + url.search + url.hash;
      }

      function localiseLithuanianNavigation() {
        if (!isLithuanian) {
          return;
        }
        var labels = {
          "Start": "Pradžia",
          "What is KinKudos": "Kas yra KinKudos",
          "Is KinKudos right for your family?": "Ar KinKudos tinka šeimai?",
          "What self-hosting means": "Ką reiškia savarankiškas diegimas?",
          "Quick install": "Greitas diegimas",
          "Your first 15 minutes": "Pirmos 15 minučių",
          "Pair a child device": "Vaiko įrenginio susiejimas",
          "Parents": "Tėvams",
          "Parent dashboard": "Tėvų skydelis",
          "Create and manage tasks": "Kurti ir valdyti darbus",
          "Review completed tasks": "Peržiūrėti atliktus darbus",
          "Assign tasks for today": "Paskirti darbus šiandienai",
          "Points, penalties, and corrections": "Taškai, nuobaudos ir korekcijos",
          "Create and manage rewards": "Kurti ir valdyti prizus",
          "Savings goals and suggestions": "Taupymo tikslai ir pasiūlymai",
          "Lottery tickets": "Loterijos bilietai",
          "Child space": "Vaiko aplinka",
          "Parent settings": "Tėvų nustatymai",
          "Security": "Saugumas",
          "Accounts and devices": "Paskyros ir įrenginiai",
          "PINs and sign-in protection": "PIN ir prisijungimo apsauga",
          "Notifications and installing KinKudos": "Pranešimai ir KinKudos diegimas",
          "Network access": "Tinklo prieiga",
          "Backups": "Atsarginės kopijos",
          "Server": "Serveris",
          "Overview": "Apžvalga",
          "Before installing": "Prieš diegiant",
          "Updates, backups, and recovery": "Atnaujinimai, kopijos ir atkūrimas",
          "Family admin": "Šeimos administravimas",
          "Help": "Pagalba",
          "Reference": "Atmintinė",
          "Roles, data, and limits": "Vaidmenys, duomenys ir ribos",
          "Release and support policy": "Leidimų ir palaikymo politika",
          "Table of contents": "Turinys"
        };

        function translateText(root) {
          if (!root) {
            return;
          }
          var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
          var nodes = [];
          while (walker.nextNode()) {
            nodes.push(walker.currentNode);
          }
          nodes.forEach(function (node) {
            var value = node.nodeValue.trim();
            if (labels[value]) {
              node.nodeValue = node.nodeValue.replace(value, labels[value]);
            }
          });
        }

        translateText(document.querySelector(".md-tabs"));
        translateText(document.querySelector(".md-sidebar--primary"));
        translateText(document.querySelector(".md-sidebar--secondary"));

        var tabLabels = [
          "Pradžia",
          "Tėvams",
          "Saugumas",
          "Serveris",
          "Šeimos admin",
          "Pagalba",
          "Atmintinė"
        ];
        document.querySelectorAll(".md-tabs__link").forEach(function (link, index) {
          if (tabLabels[index]) {
            var textNode = Array.from(link.childNodes).find(function (node) {
              return node.nodeType === Node.TEXT_NODE && node.nodeValue.trim();
            });
            if (textNode) {
              textNode.nodeValue = textNode.nodeValue.replace(
                textNode.nodeValue.trim(),
                tabLabels[index]
              );
            }
          }
          if (link.getAttribute("href")) {
            var target = lithuanianPath(link.href);
            if (link.getAttribute("href") !== target) {
              link.setAttribute("href", target);
            }
          }
        });
        document.querySelectorAll(".md-sidebar--primary .md-nav__link").forEach(function (link) {
          if (link.getAttribute("href")) {
            var target = lithuanianPath(link.href);
            if (link.getAttribute("href") !== target) {
              link.setAttribute("href", target);
            }
          }
        });
        document.querySelectorAll(".md-search__input").forEach(function (input) {
          input.placeholder = "Ieškoti";
          input.setAttribute("aria-label", "Ieškoti dokumentacijoje");
        });
      }

      var header = document.querySelector(".md-header__inner");
      var headerExisting = header && header.querySelector(".kinkudos-language-switcher");
      if (headerExisting && headerExisting.dataset.path !== path) {
        headerExisting.remove();
        headerExisting = null;
      }
      if (header && !headerExisting) {
        var headerSwitcher = switcher("kinkudos-language-switcher--header");
        var themeControl = header.querySelector(".md-header__option");
        header.insertBefore(headerSwitcher, themeControl || null);
      }

      localiseLithuanianNavigation();

      }

      mountLanguageSwitchers();
      if (typeof document$ !== "undefined") {
        document$.subscribe(mountLanguageSwitchers);
      }
    });
  </script>
{% endblock %}
