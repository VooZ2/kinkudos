{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  <script defer src="https://stats.enduristas.lt/script.js" data-website-id="b47fc9f2-ce4f-4aee-8254-5935471ffb21"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      function mountLanguageSwitchers() {
      var path = window.location.pathname;
      var isLithuanian = /\.lt\/$/.test(path) || path === "/index.lt/";
      var englishPath = isLithuanian
        ? path.replace(/index\.lt\/$/, "").replace(/\.lt\/$/, "/") || "/"
        : path;
      var lithuanianPath = isLithuanian
        ? path
        : path === "/" ? "/index.lt/" : path.replace(/\/$/, ".lt/");

      function switcher(className) {
        var nav = document.createElement("div");
        nav.className = "kinkudos-language-switcher " + className;
        nav.dataset.path = path;
        nav.setAttribute(
          "aria-label",
          isLithuanian ? "Dokumentacijos kalba" : "Documentation language"
        );
        nav.innerHTML =
          '<label><span>' + (isLithuanian ? "Kalba" : "Language") + '</span>' +
          '<select aria-label="' + (isLithuanian ? "Dokumentacijos kalba" : "Documentation language") + '">' +
          '<option value="' + englishPath + '"' + (!isLithuanian ? " selected" : "") + '>English</option>' +
          '<option value="' + lithuanianPath + '"' + (isLithuanian ? " selected" : "") + '>Lietuvių</option>' +
          '</select></label>';
        nav.querySelector("select").addEventListener("change", function (event) {
          window.location.assign(event.target.value);
        });
        return nav;
      }

      var header = document.querySelector(".md-header__inner");
      var headerExisting = header && header.querySelector(".kinkudos-language-switcher");
      if (headerExisting && headerExisting.dataset.path !== path) {
        headerExisting.remove();
        headerExisting = null;
      }
      if (header && !headerExisting) {
        var headerSwitcher = switcher("kinkudos-language-switcher--header");
        var themeControl = header.querySelector(".md-header__option");
        header.insertBefore(headerSwitcher, themeControl || null);
      }

      }

      mountLanguageSwitchers();
      new MutationObserver(mountLanguageSwitchers).observe(document.body, {
        childList: true,
        subtree: true
      });
    });
  </script>
{% endblock %}
